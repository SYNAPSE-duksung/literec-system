services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: literec
      POSTGRES_PASSWORD: literec
      POSTGRES_DB: literec
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U literec"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://literec:literec@db:5432/literec
      # STEP 3(docker-compose에 ml 서비스 추가)는 아직 안 해서, 로컬에서 직접 띄운
      # ML 서버(호스트의 8001)를 바라보도록 임시로 지정한다 — host.docker.internal이
      # Docker Desktop에서 호스트 머신을 가리킨다.
      ML_SERVER_URL: http://host.docker.internal:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # 호스트(Windows)의 .venv가 컨테이너(Linux)로 그대로 마운트되며 매번
      # venv를 재생성하는 문제를 막기 위해 .venv만 별도 named volume으로 분리한다.
      - backend_venv:/app/.venv
      # scripts/seed.py가 컨테이너 루트 기준 /data/processed/*.jsonl을 읽는다
      # (Path(__file__).resolve().parents[2] == 컨테이너 루트) — 시드 원본 데이터를 읽기 전용으로 마운트.
      - ./data:/data:ro

volumes:
  db_data:
  backend_venv:
