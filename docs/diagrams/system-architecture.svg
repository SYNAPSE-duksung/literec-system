<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" role="img" aria-label="클라이언트에서 시작한 요청이 backend 프로세스(FastAPI) 경계 안의 routers를 거쳐, 공유 로직이면 services를 경유하고 단순 조회면 곧장 models로 간다. models는 SQLAlchemy로 경계 밖의 실제 Postgres 서비스에 연결하고, routers는 별도로 httpx를 통해 경계 밖의 ML 서버(PyTorch 기반, 별도 FastAPI 프로세스)도 직접 호출한다.">
