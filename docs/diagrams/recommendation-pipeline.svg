<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 350" role="img" aria-label="정적 시드 리뷰 440건과, 게시판에 실사용자가 쓴 리뷰가 매일 새벽 2시 CronJob으로 구조화된 결과(6)가 합쳐져 임베딩(1)되고, KMeans로 전역 클러스터링(2)된 뒤 콜드스타트로 보강(3)된다. 온보딩에서 만든 유저 프로필 벡터와 이 책 아이덴티티를 매칭(4)해 recommend()가 book_id 리스트를 반환하고, 매칭에 쓰인 결의 원문 리뷰가 그대로 XAI 추천 카드의 이유(5)가 된다.">
  <defs>
    <marker id="pipeArrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill" />
    </marker>
  </defs>
  <style>
    text { font-family: 'IBM Plex Mono', 'D2Coding', ui-monospace, monospace; }
    .card-body { fill: #ffffff; }
    .box-border { stroke: #c7c5be; fill: none; }
    .box-border-dashed { stroke: #9b9890; fill: none; stroke-dasharray: 4 3; }
    .label-title { fill: #1a1a1a; }
    .label-muted { fill: #767671; }
    .edge { stroke: #9b9890; fill: none; }
    .edge-label { fill: #767671; }
    .arrow-fill { fill: #9b9890; }
    .step-badge { fill: #1a1a1a; }
    .step-badge-text { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .card-body { fill: #202226; }
      .box-border { stroke: #43423d; }
      .box-border-dashed { stroke: #55534c; }
      .label-title { fill: #ede9e2; }
      .label-muted { fill: #9b9890; }
      .edge { stroke: #6d6b64; }
      .edge-label { fill: #9b9890; }
      .arrow-fill { fill: #6d6b64; }
      .step-badge { fill: #ede9e2; }
      .step-badge-text { fill: #17181a; }
    }
  </style>

  <!-- 화살표 -->
  <g class="edge" stroke-width="1.3">
    <path d="M105,80 L105,140" marker-end="url(#pipeArrow2)" />
    <path d="M390,55 L420,55" marker-end="url(#pipeArrow2)" />
    <path d="M515,80 L515,112 L95,112 L95,140" marker-end="url(#pipeArrow2)" />
    <path d="M170,167 L196,167" marker-end="url(#pipeArrow2)" />
    <path d="M370,167 L396,167" marker-end="url(#pipeArrow2)" />
    <path d="M570,167 L596,167" marker-end="url(#pipeArrow2)" />
    <path d="M770,167 L796,167" marker-end="url(#pipeArrow2)" />
    <path d="M930,167 L956,167" marker-end="url(#pipeArrow2)" />
    <path d="M190,305 L220,305" marker-end="url(#pipeArrow2)" />
    <path d="M315,280 L315,240 L685,240 L685,199" marker-end="url(#pipeArrow2)" />
  </g>
  <g font-size="9px" class="edge-label">
    <text x="522" y="102" text-anchor="middle">440건 + DB 구조화 결과 concat</text>
    <text x="500" y="270" text-anchor="middle">선호/기피 벡터</text>
  </g>

  <g font-weight="600">
    <!-- A: 정적 시드 리뷰 -->
    <rect x="20" y="30" width="170" height="50" rx="8" class="card-body box-border" stroke-width="1.4" />
    <text x="105" y="52" text-anchor="middle" font-size="10" class="label-title">정적 시드 리뷰</text>
    <text x="105" y="66" text-anchor="middle" font-size="8" font-weight="400" class="label-muted">structured_reviews.jsonl · 440건</text>

    <!-- B: 게시판 실사용 리뷰 -->
    <rect x="220" y="30" width="170" height="50" rx="8" class="card-body box-border" stroke-width="1.4" />
    <text x="305" y="52" text-anchor="middle" font-size="10" class="label-title">게시판 실사용 리뷰</text>
    <text x="305" y="66" text-anchor="middle" font-size="8" font-weight="400" class="label-muted">reviews · is_processed=false</text>

    <!-- C: CronJob 구조화 (step 6) -->
    <rect x="420" y="30" width="190" height="50" rx="8" class="card-body box-border-dashed" stroke-width="1.4" />
    <circle cx="432" cy="42" r="9" class="step-badge" />
    <text x="432" y="46" text-anchor="middle" font-size="9.5" font-weight="700" class="step-badge-text">6</text>
    <text x="518" y="52" text-anchor="middle" font-size="10" class="label-title">구조화 CronJob</text>
    <text x="518" y="66" text-anchor="middle" font-size="8" font-weight="400" class="label-muted">매일 새벽 2시 · Upstage → review_axes</text>

    <!-- D: 임베딩 (step 1) -->
    <rect x="20" y="140" width="150" height="55" rx="8" class="card-body box-border" stroke-width="1.4" />
    <circle cx="32" cy="152" r="9" class="step-badge" />
    <text x="32" y="156" text-anchor="middle" font-size="9.5" font-weight="700" class="step-badge-text">1</text>
    <text x="86" y="173" text-anchor="middle" font-size="10" class="label-title">임베딩</text>
    <text x="86" y="187" text-anchor="middle" font-size="7.8" font-weight="400" class="label-muted">ko-sroberta-multitask</text>

    <!-- E: 전역 클러스터링 (step 2) -->
    <rect x="200" y="140" width="170" height="55" rx="8" class="card-body box-border" stroke-width="1.4" />
    <circle cx="212" cy="152" r="9" class="step-badge" />
    <text x="212" y="156" text-anchor="middle" font-size="9.5" font-weight="700" class="step-badge-text">2</text>
    <text x="273" y="173" text-anchor="middle" font-size="10" class="label-title">전역 클러스터링</text>
    <text x="273" y="187" text-anchor="middle" font-size="8" font-weight="400" class="label-muted">KMeans · k=30</text>

    <!-- F: 콜드스타트 보강 (step 3) -->
    <rect x="400" y="140" width="170" height="55" rx="8" class="card-body box-border" stroke-width="1.4" />
    <circle cx="412" cy="152" r="9" class="step-badge" />
    <text x="412" y="156" text-anchor="middle" font-size="9.5" font-weight="700" class="step-badge-text">3</text>
    <text x="473" y="173" text-anchor="middle" font-size="10" class="label-title">콜드스타트 보강</text>
    <text x="473" y="187" text-anchor="middle" font-size="8" font-weight="400" class="label-muted">네이버 줄거리 임베딩</text>

    <!-- G: 매칭 (step 4) -->
    <rect x="600" y="140" width="170" height="55" rx="8" class="card-body box-border" stroke-width="1.4" />
    <circle cx="612" cy="152" r="9" class="step-badge" />
    <text x="612" y="156" text-anchor="middle" font-size="9.5" font-weight="700" class="step-badge-text">4</text>
    <text x="685" y="173" text-anchor="middle" font-size="10" class="label-title">매칭</text>
    <text x="685" y="187" text-anchor="middle" font-size="7.8" font-weight="400" class="label-muted">score = max_sim(선호) − λ·max_sim(기피)</text>

    <!-- H: recommend() -->
    <rect x="800" y="140" width="130" height="55" rx="8" class="card-body box-border" stroke-width="1.4" />
    <text x="865" y="165" text-anchor="middle" font-size="10" class="label-title">recommend()</text>
    <text x="865" y="180" text-anchor="middle" font-size="7.8" font-weight="400" class="label-muted">user_id, k → book_id 리스트</text>

    <!-- I: XAI 추천 카드 (step 5) -->
    <rect x="960" y="140" width="170" height="55" rx="8" class="card-body box-border" stroke-width="1.4" />
    <circle cx="972" cy="152" r="9" class="step-badge" />
    <text x="972" y="156" text-anchor="middle" font-size="9.5" font-weight="700" class="step-badge-text">5</text>
    <text x="1045" y="170" text-anchor="middle" font-size="10" class="label-title">XAI 추천 카드</text>
    <text x="1045" y="186" text-anchor="middle" font-size="8" font-weight="400" class="label-muted">매칭된 결의 medoid 리뷰 = 추천 이유</text>

    <!-- J: 온보딩 -->
    <rect x="20" y="280" width="170" height="50" rx="8" class="card-body box-border" stroke-width="1.4" />
    <text x="105" y="302" text-anchor="middle" font-size="10" class="label-title">온보딩</text>
    <text x="105" y="316" text-anchor="middle" font-size="8" font-weight="400" class="label-muted">선호 정서 · 기피 요소 태그</text>

    <!-- K: 유저 프로필 벡터화 -->
    <rect x="220" y="280" width="190" height="50" rx="8" class="card-body box-border" stroke-width="1.4" />
    <text x="315" y="302" text-anchor="middle" font-size="10" class="label-title">유저 프로필 벡터화</text>
    <text x="315" y="316" text-anchor="middle" font-size="8" font-weight="400" class="label-muted">build_single_user_profile()</text>
  </g>
</svg>
