<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" role="img" aria-label="GitHub에 main 브랜치로 push하면 GitHub Actions가 변경된 경로만 감지해 Docker 이미지를 빌드하고 Docker Hub에 푸시한 뒤 kubectl rollout restart로 배포한다. 단일 EC2(t3.small) 인스턴스 위 k3s 클러스터 안에서 클라이언트 요청은 Traefik Ingress를 거쳐 backend 네임스페이스의 backend·frontend Deployment로 라우팅된다. backend는 SQLAlchemy로 data 네임스페이스의 postgres를 직접 조회하고, httpx로 ml 네임스페이스의 ml-server를 호출한다. ml-server도 프로필·구조화 리뷰 조회를 위해 postgres에 직접 연결한다. ml 네임스페이스에는 매일 새벽 2시 신규 리뷰를 Upstage Solar API로 구조화해 review_axes에 저장하는 structure-reviews CronJob과, 매주 일요일 새벽 3시 ml-server에 카탈로그 재계산을 요청하는 weekly-rebuild CronJob이 함께 떠 있다.">
