<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" role="img" aria-label="GitHub에 main 브랜치로 push하면 GitHub Actions가 변경된 경로만 감지해 Docker 이미지를 빌드하고 Docker Hub에 푸시한 뒤 kubectl rollout restart로 배포한다. 단일 EC2(t3.small) 인스턴스 위 k3s 클러스터 안에서 클라이언트 요청은 Traefik Ingress를 거쳐 backend 네임스페이스의 backend·frontend Deployment로 라우팅된다. backend는 data 네임스페이스의 postgres와 ml 네임스페이스의 ml-server를 호출하고, ml 네임스페이스에는 매일 새벽 2시 신규 리뷰를 Upstage Solar API로 구조화하는 structure-reviews CronJob과 매주 일요일 새벽 3시 카탈로그를 재계산하는 weekly-rebuild CronJob이 함께 떠 있다.">
  <defs>
    <marker id="infraArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill" />
    </marker>
  </defs>
  <style>
    text { font-family: 'IBM Plex Mono', 'D2Coding', ui-monospace, monospace; }
    .card-ink { fill: #1a1a1a; }
    .card-accent { fill: #3d5a80; }
    .card-body { fill: #ffffff; }
    .card-line { stroke: #e5e5e0; }
    .card-accent-line { stroke: #3d5a80; }
    .label-on-dark { fill: #fafaf8; }
    .label-on-accent { fill: #ffffff; }
    .label-muted { fill: #767671; }
    .label-title { fill: #1a1a1a; }
    .edge { stroke: #767671; fill: none; }
    .edge-dashed { stroke: #767671; fill: none; stroke-dasharray: 4 3; }
    .edge-label { fill: #767671; }
    .arrow-fill { fill: #767671; }
    .cron-head { fill: #c1483d; }
    .cron-border { stroke: #c1483d; }
    .ns-border { stroke: #9b9890; fill: none; stroke-dasharray: 3 3; }
    .k8s-border { stroke: #767671; fill: none; stroke-dasharray: 6 4; }
    @media (prefers-color-scheme: dark) {
      .card-ink { fill: #ede9e2; }
      .card-accent { fill: #7fa2c9; }
      .card-body { fill: #202226; }
      .card-line { stroke: #34363a; }
      .card-accent-line { stroke: #7fa2c9; }
      .label-on-dark { fill: #17181a; }
      .label-on-accent { fill: #10161d; }
      .label-muted { fill: #9b9890; }
      .label-title { fill: #ede9e2; }
      .edge { stroke: #9b9890; }
      .edge-dashed { stroke: #9b9890; }
      .edge-label { fill: #9b9890; }
      .arrow-fill { fill: #9b9890; }
      .cron-head { fill: #e0796d; }
      .cron-border { stroke: #e0796d; }
      .ns-border { stroke: #55534c; }
      .k8s-border { stroke: #55534c; }
    }
  </style>

