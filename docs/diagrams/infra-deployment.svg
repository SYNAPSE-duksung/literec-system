    <text x="410" y="62" text-anchor="middle" font-size="8.3" font-weight="400" class="label-muted">이미지 레지스트리</text>

    <rect x="900" y="20" width="160" height="50" rx="8" class="card-body" />
    <path d="M900,28 a8,8 0 0 1 8,-8 h144 a8,8 0 0 1 8,8 v10 h-160 z" class="card-ink" />
    <rect x="900" y="20" width="160" height="50" rx="8" fill="none" class="card-line" stroke-width="1.5" />
    <text x="980" y="45" text-anchor="middle" font-size="10" class="label-on-dark">클라이언트</text>
    <text x="980" y="62" text-anchor="middle" font-size="8.3" font-weight="400" class="label-muted">React 앱 (브라우저)</text>
  </g>

  <!-- ============ k3s 클러스터 경계 ============ -->
  <rect x="20" y="96" width="1040" height="440" rx="10" class="k8s-border" stroke-width="1.6" />
