    <path d="M410,70 L410,96" marker-end="url(#infraArrow)" />
  </g>
  <g font-size="9px" class="edge-label">
    <text x="144" y="37" text-anchor="middle">push</text>
    <text x="325" y="37" text-anchor="middle">build+push</text>
    <text x="270" y="88" text-anchor="middle">rollout restart</text>
    <text x="410" y="88" text-anchor="middle">image pull</text>
    <text x="480" y="188" text-anchor="middle">/api</text>
    <text x="600" y="198" text-anchor="middle">/</text>
    <text x="286" y="254" text-anchor="middle">SQLAlchemy</text>
    <text x="505" y="207" text-anchor="middle">DB 프로필 · 구조화 리뷰 조회</text>
    <text x="330" y="330" text-anchor="middle">httpx (프로필/추천 요청)</text>
    <text x="990" y="393" text-anchor="middle">POST /admin/rebuild-catalog</text>
    <text x="640" y="395" text-anchor="middle">리뷰 조회 · review_axes 저장</text>
    <text x="855" y="520" text-anchor="middle">Upstage Solar API</text>
    <text x="855" y="532" text-anchor="middle">(5축 구조화)</text>
  </g>

