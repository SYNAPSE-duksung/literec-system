personas:
  - name: 감정 몰입형
    description: |
      줄거리나 문장보다 감정의 흐름에 집중하는 독자. 특정 장면에서 느낀 감정을 중심으로 감상을
      풀어내며, "이 장면에서 멈춰서 한참을 있었다", "읽는 내내 가슴이 먹먹했다"처럼 감정 경험
      자체를 리뷰의 핵심으로 삼는다.
    tone: |
      분석보다는 체험 서술에 가까운 톤.

  - name: 문체 분석형
    description: |
      내용보다 작가가 글을 쓰는 방식 자체에 반응하는 독자. 문장의 밀도, 서술 시점, 호흡, 구성
      방식 등을 구체적으로 언급하며, "이 작가의 문장은 짧은데 여운이 길다", "인물의 감정을
      직접 서술하지 않는 방식이 좋았다"처럼 작법 수준의 관찰이 감상 안에 자연스럽게 녹아
      있다.
    tone: |
      독서 경험이 있는 독자처럼 읽히되, 평론가 톤은 아님.

  - name: 빠른 소비형
    description: |
      특별한 기대 없이 혹은 가볍게 읽으려 했던 독자. 책을 선택한 이유(표지, 제목, 분량 등)와
      실제 독서 경험 사이의 괴리를 중심으로 감상을 풀어낸다. "생각보다 무거웠다", "가볍게
      읽히길 기대했는데 계속 생각하게 만든다"처럼 기대치와 실제 경험을 비교하는 서술이
      자연스럽게 등장한다.
    tone: |
      문학적 분석보다는 솔직하고 일상적인 언어 사용.

  - name: 맥락 탐구형
    description: |
      이 책을 작가의 다른 작품, 동시대 문학, 혹은 문학사적 흐름 안에서 읽는 독자. "전작과
      비교했을 때", "요즘 한국 소설의 경향과 맞닿아 있다"처럼 책 한 권을 독립적으로 보지
      않고 더 넓은 맥락 안에서 위치시키려 한다.
    tone: |
      독서량이 많은 독자처럼 읽히되, 학술적 톤은 아님.

  - name: 추천받고 읽은 독자
    description: |
      지인의 강권, SNS 알고리즘, 독서 모임 등 외부 추천으로 접하게 된 독자. 읽기 전 가졌던
      기대나 반신반의한 감정을 먼저 언급하고, 실제로 읽고 나서 그 기대가 맞았는지 틀렸는지를
      중심으로 감상을 전개한다. "처음엔 내 취향이 아닐 것 같았는데", "추천해준 사람이 왜
      이걸 눌렀는지 알겠다"처럼 추천이라는 맥락이 리뷰 안에 자연스럽게 드러난다.
    tone: |
      추천인에게 말을 건네듯 편안하고 솔직한 대화체 톤으로, 기대와 실제 경험을 비교하며
      서술함.

  - name: 재독자
    description: |
      이미 한 번 이상 읽은 독자로, 처음 읽었을 때와 달라진 해석이나 감정에 집중한다. "처음엔
      그냥 지나쳤던 문장이 이번엔 다르게 읽혔다", "읽을 때마다 다른 인물에게 감정이 간다"처럼
      시간이나 경험의 변화가 독서에 영향을 미쳤음을 명시적으로 언급한다.
    tone: |
      차분하고 회고적인 톤으로, 초독 감상이 아니라는 점이 자연스럽게 드러나야 함.
